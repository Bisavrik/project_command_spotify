<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LumiTune — Увійти</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style_registration_1.css">
</head>

<body>
  <div class="page-bg">

    <div class="card small">

      <div class="logo">
        <img src="img/logo.png" class="logo-img">
      </div>

      <h1 class="title">Пориньте вперше<br>у LumiTune</h1>
      <label class="label">Електронна пошта</label>
      <input class="input email" type="email" placeholder="@gmail.com">
    <button class="primary next" onclick="window.location.href='registraton_2.html';">
    Далі
</button>

      <div class="divider">або</div>

      <div class="socials">
        <button class="social fb">
          <span class="ico"><img src="img/fee.png"></span>
          Увійти з Facebook
        </button>

        <button class="social gg">
          <span class="ico"><img src="img/gg.png"></span>
          Увійти з Google
        </button>

        <button class="social ap">
          <span class="ico"><img src="img/apl.png"></span>
          Увійти з Apple
        </button>
      </div>

      <div class="bottom"></div>

      <div class="footer">
        Є акаунт?
        <a class="signup" href="sign_in.html">Увійти до нього</a>
      </div>

    </div>

  </div>
</body>
</html>
