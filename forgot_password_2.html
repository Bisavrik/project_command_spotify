<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_forgot_password_2.css">
</head>
<body>

<div class="container">
    <div class="card">

        <a href="index4.html" class="back">Назад</a>

         <div class="logo">
        <img src="img/logo.png" class="logo-img">
      </div>

       <h2 class="center-title">Забули пароль?</h2>


        <p class="subtitle">
            Введіть 6-значний код, який ми відправили<br>
            вам на адресу <b>G*****2@G**l.com</b>
        </p>

        <label class="label">Код</label>
        <input type="text" maxlength="6" placeholder="000-00" class="input">

        <button class="btn">Продовжити</button>

        <!-- АБО -->
        <div class="divider">
            <span>або</span>
        </div>

        <button class="new-code">Отримайте новий код</button>

        <p class="login-text">
            Згадали пароль? <a href="#" class="login-link">Увійдіть до аккаунту</a>
        </p>

        <div class="bottom-line"></div>

    </div>
</div>

</body>
</html>
