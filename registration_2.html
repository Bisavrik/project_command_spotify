<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Створити профіль</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style_registration_2.css">
</head>

<body>
  <div class="page-bg">

    <div class="card">

      <a href="registration_1.html" class="back">Назад</a>

      <div class="logo">
        <img src="img/logo.png" class="logo-img">
      </div>

      <h1 class="title">Створіть профіль</h1>
      <div class="step-sub">Крок 1 із 2</div>

      <div class="step-line"></div>

      <label class="label">Пароль</label>

      <div class="password-wrap">
        <input type="password" class="input" placeholder="********">
        <button class="eye-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z"
             stroke="#7db7ff" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" stroke="#7db7ff" stroke-width="2"/>
          </svg>
        </button>
      </div>

      <div class="req-title">Пароль має містити принаймні:</div>

      <div class="req-list">
        <label><input type="radio" name="r"> 1 літеру</label>
        <label><input type="radio" name="r"> 1 число або 1 спеціальний символ (наприклад, !?&#)</label>
        <label><input type="radio" name="r"> 8 символів</label>
      </div>

      <button class="primary">Далі</button><!-- ДОБАВИТЬ НА ПЕРЕХОД НА registraton_3.html -->

    </div>

  </div>
</body>
</html>
