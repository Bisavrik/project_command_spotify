<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_create_new_password.css">
</head>
<body>

<div class="container">
    <div class="card">

              <div class="back-wrapper">
  <a href="forgot_password_2.html" class="back">Назад</a>
</div>

       <div class="logo">
        <img src="img/logo.png" class="logo-img">
      </div>

        <h2>Придумайте новий пароль</h2>

        <!-- ПОЛЕ 1 -->
        <label class="label">Пароль</label>
        <div class="password-wrap">
            <input type="password" class="input password" placeholder="********">
            <button class="eye-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z"
                        stroke="#7db7ff" stroke-width="2"/>
                    <circle cx="12" cy="12" r="3" stroke="#7db7ff" stroke-width="2"/>
                </svg>
            </button>
        </div>

        <!-- ПОЛЕ 2 -->
        <label class="label">Повторіть пароль</label>
        <div class="password-wrap">
            <input type="password" class="input password" placeholder="********">
            <button class="eye-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z"
                        stroke="#7db7ff" stroke-width="2"/>
                    <circle cx="12" cy="12" r="3" stroke="#7db7ff" stroke-width="2"/>
                </svg>
            </button>
        </div>

        <button class="btn">Змінити пароль</button><!-- ДОБАВИТЬ НА ПЕРЕХОД НА sign_in.html -->

        <div class="divider"><span>або</span></div>

        <button class="new-code">Отримайте новий код</button><!-- ДОБАВИТЬ НА ПЕРЕХОД НА forgot_password_2.html -->

        <p class="login-text">
            Згадали пароль?
            <a href="sign_in.html" class="login-link">Увійдіть до аккаунту</a>
        </p>

    </div>
</div>

</body>
</html>
